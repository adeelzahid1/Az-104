<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try { var t = localStorage.getItem('az104-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>

<body>
  <app-root>
    <!-- Shown until the app has started. -->

      .boot { display: grid; place-content: center; justify-items: center; gap: 14px; min-height: 100vh; font: 600 1rem 'Segoe UI', system-ui, sans-serif; color: #7a8594; }
      .boot i { width: 42px; height: 42px; border: 4px solid rgba(127, 127, 127, 0.3); border-top-color: #0f6cbd; border-radius: 50%; animation: boot 0.8s linear infinite; }
      @keyframes boot { to { transform: rotate(360deg); } }
    </style>
    <div class="boot" role="status"><i aria-hidden="true"></i>AZ-104 Prep…</div>
  </app-root>
