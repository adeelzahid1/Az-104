@let tc = t().cheat;

<header class="top">
  <div>
    <h1>{{ tc.title }}</h1>
    <p class="muted">{{ tc.lead }}</p>
  </div>
  <button type="button" class="btn no-print" (click)="print()">{{ tc.print }}</button>
</header>

<div class="tools no-print">
  <input
    #box
    type="search"
    class="search"
    [placeholder]="tc.search"
    [attr.aria-label]="tc.search"
    [value]="search()"
    (input)="search.set(box.value)"
  />
  <div class="chips" role="group" [attr.aria-label]="tc.groups">
    <button
      type="button"
      [class.on]="!group() && !search().trim()"
      [attr.aria-pressed]="!group() && !search().trim()"
      (click)="choose('')"
    >
      {{ tc.all }}
    </button>
    @for (c of chips(); track c.id) {
      <button
        type="button"
        [class.on]="group() === c.id && !search().trim()"
        [attr.aria-pressed]="group() === c.id && !search().trim()"
        (click)="choose(c.id)"
      >
        {{ c.label }}
      </button>
    }
  </div>
</div>

@if (search().trim()) {
  <p class="muted" role="status">{{ tc.found(count()) }}</p>
}

@for (g of groups(); track g.id) {
  <section>
    <h2>{{ g.title }}</h2>
    <div class="cards">
      @for (c of g.cards; track c.id) {
        <app-cheat-card [card]="c">
          <a routerLink="/study" [queryParams]="{ s: c.section }">{{ tc.practise(c.section) }}</a>
        </app-cheat-card>
      }
    </div>
  </section>
} @empty {
  <p class="card">{{ tc.none }}</p>
}
