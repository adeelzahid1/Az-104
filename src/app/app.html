@let tx = t();
<a class="skip" href="#main">{{ tx.skip }}</a>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/">
      <span class="logo" aria-hidden="true">A</span>
      <span>AZ-104 Prep</span>
    </a>
    <div class="topbar-right">
      <nav #menu aria-label="Main">
        @for (link of links; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: link.exact }"
            ariaCurrentWhenActive="page"
          >
            {{ tx.nav[link.key] }}
          </a>
        }
      </nav>
      <div class="tools">
        <app-full-screen-button [compact]="true" />
        <button type="button" class="icon" [title]="tx.keys.theme" [attr.aria-label]="tx.keys.theme" (click)="display.toggleTheme()">
          ◐
        </button>
        <button
          type="button"
          class="icon hint"
          [title]="tx.keys.title + ' (?)'"
          [attr.aria-label]="tx.keys.title"
          (click)="shortcuts.helpOpen.set(true)"
        >
          ⌨
        </button>
      </div>
      <div class="lang" role="group" [attr.aria-label]="tx.langSwitch">
        <button type="button" [class.on]="lang() === 'en'" [attr.aria-pressed]="lang() === 'en'" (click)="setLang('en')">
          EN
        </button>
        <button
          type="button"
          [class.on]="lang() === 'roman'"
          [attr.aria-pressed]="lang() === 'roman'"
          title="Roman Urdu"
          (click)="setLang('roman')"
        >
          Roman
        </button>
      </div>
    </div>
  </div>
</header>

<main id="main" class="page">
  <router-outlet />
</main>

<footer class="footer">{{ tx.footer }}</footer>

@if (display.fullScreen()) {
  <app-full-screen-button class="float-exit" />
}
@if (scrolled()) {
  <button type="button" class="btn to-top no-print" [attr.aria-label]="tx.keys.top" [title]="tx.keys.top" (click)="toTop()">
    ↑
  </button>
}
<app-shortcut-help />
