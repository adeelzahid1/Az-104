<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/">
      <span class="logo" aria-hidden="true">A</span>
      <span>AZ-104 Prep</span>
    </a>
    <nav aria-label="Main">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          ariaCurrentWhenActive="page"
        >
          {{ link.label }}
        </a>
      }
    </nav>
  </div>
</header>

<main id="main" class="page">
  <router-outlet />
</main>

<footer class="footer">
  Original practice questions written from Microsoft Learn documentation. Not affiliated with
  Microsoft. Your progress is saved only in this browser.
</footer>
